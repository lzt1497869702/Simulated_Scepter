# ========== 字体文件 ==========
# resource/font 下的文件名；留空或加载失败时回退微软雅黑。
font_file = "HarmonyOS_SansSC_Medium.ttf"

# ========== 全局界面字号（px） ==========
# 全局默认字号：所有没有单独指定字号的界面文字。
