# 标题栏主标题（右上角程序名）。
window_title_px =  24
# 标题栏版本号标签。
version_px = 18
# 运行状态标签。
status_px = 16

# ========== 运行输出 ==========
# 主界面右侧「运行输出」日志框。
log_px = 18

# ========== 弹窗与浮层 ==========
# 用户协议/免责声明弹窗标题。
about_title_px = 19
# 高级功能解锁弹窗标题。
unlock_title_px = 21
# 解锁弹窗底部按钮文字。
dialog_note_px = 12
# 日常遗器本设置的分区标题。
daily_header_px = 18
