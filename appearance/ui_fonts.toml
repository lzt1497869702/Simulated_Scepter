# 区域标题，如侧栏「运行概览」等 role="heading" 标签。
heading_px = 19
# 顶部选项卡标题（中控台 / 设置 / 关于）。
tab_px = 19

# 灰色次要标题，如 “识别帧率”。
muted_px = 16
# 性能栏里的资源数值。
